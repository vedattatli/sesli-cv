<title>Sesli CV Hazırlayıcı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Soruları sesli yanıtlayarak CV hazırlayın; sonunda PDF olarak indirin.">
<meta name="theme-color" content="#1F5C4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first interview — one question on stage, a thumb dock with the big mic at the bottom;
   on wide screens a numbered outline rail on the left and the live A4 preview on the right. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --surface-2: #F4F7F5;
  --ink: #16201B;
  --ink-2: #34413B;
  --muted: #5D6A64;
  --line: #D3DBD6;
  --line-strong: #6F7C76;
  --accent: #1F5C4A;
  --accent-hover: #174A3B;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EAE2;
  --rec: #C63A28;
  --rec-ink: #FFFFFF;
  --rec-soft: #F8DED9;
  --warn-bg: #FFF3DA;
  --warn-ink: #6B4A00;
  --sheet: #FFFFFF;
  --scrim: rgba(14, 20, 18, .48);
  --shadow-sm: 0 1px 2px rgba(22, 32, 27, .07);
  --shadow: 0 1px 2px rgba(22, 32, 27, .06), 0 10px 30px rgba(22, 32, 27, .08);
  --f-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --dock-h: 148px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #151D1A; --surface-2: #1A2420; --ink: #E5EBE7; --ink-2: #C2CCC7;
    --muted: #94A39C; --line: #2B3732; --line-strong: #66756E; --accent: #7AC6AA; --accent-hover: #95D4BC; --accent-ink: #0A1411;
    --accent-soft: #1C352D; --rec: #FF6E5B; --rec-ink: #1A0806; --rec-soft: #3A1E1A; --warn-bg: #33290F;
    --warn-ink: #F3D58E; --sheet: #FFFFFF; --scrim: rgba(0, 0, 0, .6);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #151D1A; --surface-2: #1A2420; --ink: #E5EBE7; --ink-2: #C2CCC7;
  --muted: #94A39C; --line: #2B3732; --line-strong: #66756E; --accent: #7AC6AA; --accent-hover: #95D4BC; --accent-ink: #0A1411;
  --accent-soft: #1C352D; --rec: #FF6E5B; --rec-ink: #1A0806; --rec-soft: #3A1E1A; --warn-bg: #33290F;
  --warn-ink: #F3D58E; --sheet: #FFFFFF; --scrim: rgba(0, 0, 0, .6);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.fill { fill: currentColor; stroke: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: saturate(1.2) blur(10px); backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 1480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { font-family: var(--f-display); font-size: 22px; line-height: 1; color: var(--ink); text-decoration: none; letter-spacing: .005em; white-space: nowrap; }
.brand em { font-style: italic; color: var(--accent); }
.progress { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
body[data-kind="intro"] .progress { visibility: hidden; }
.progress-text .long { display: none; }
@media (min-width: 640px) { .progress-text .long { display: inline-block; } }
.progress-text { flex: none; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress-text .long { max-width: 28ch; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.progress-bar { flex: 1; min-width: 24px; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; max-width: 260px; }
.progress-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--line); }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.pill-btn {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink);
}
.pill-btn:hover { border-color: var(--accent); }

/* ---------- Shell ---------- */
.shell { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 18px 0; }
.rail, .side-preview { display: none; }
.stage { min-width: 0; outline: none; padding-bottom: calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .shell { grid-template-columns: 210px minmax(0, 1fr); padding-block: 28px 0; }
  .rail { display: block; position: sticky; top: 84px; align-self: start; }
  .stage { padding-bottom: 0; }
}
@media (min-width: 1240px) {
  .shell { grid-template-columns: 210px minmax(0, 1fr) 360px; }
  .side-preview { display: block; position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding-bottom: 20px; }
  body[data-kind="preview"] .shell { grid-template-columns: 210px minmax(0, 1fr); }
  body[data-kind="preview"] .side-preview { display: none; }
  .hide-wide { display: none !important; }
}

/* Rail: the CV's sections in the order they are asked */
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: step; }
.rail li { counter-increment: step; }
.rail button {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-size: 14px;
}
.rail button::before {
  content: counter(step); width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); color: var(--muted); background: var(--surface);
}
.rail li.done button::before { content: "✓"; background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 700; }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail li.current button { color: var(--ink); font-weight: 600; background: var(--surface); box-shadow: var(--shadow-sm); }
.rail li.current button::before { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.saved { margin: 16px 10px 0; font-size: 12.5px; color: var(--muted); }

/* ---------- Step stage ---------- */
.step { display: grid; gap: 22px; max-width: 720px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin: 0; font-variant-numeric: tabular-nums; }
.q-wrap { display: grid; gap: 10px; }
.question {
  font-family: var(--f-display); font-weight: 400; margin: 0; color: var(--ink);
  font-size: clamp(30px, 4.6vw + 12px, 46px); line-height: 1.08; letter-spacing: -.005em; text-wrap: balance;
}
.hint { margin: 0; color: var(--muted); font-size: 16px; max-width: 58ch; text-wrap: pretty; }
.say { color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  background: var(--warn-bg); color: var(--warn-ink); font-size: 14px;
}
.banner .ico { margin-top: 2px; }
.banner b { font-weight: 600; }
kbd { font-family: inherit; font-size: .92em; padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .9; white-space: nowrap; }

/* Fields: quiet until active; the active one is lifted onto a sheet */
.fields { display: grid; gap: 6px; }
.field {
  position: relative; display: grid; gap: 4px; padding: 12px 14px 12px; border-radius: var(--r);
  border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s;
}
.field.is-active { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.field.is-listening { border-color: var(--rec); box-shadow: 0 0 0 3px var(--rec-soft); }
.field-label { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.field-label .opt { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.field-row { display: flex; gap: 8px; align-items: flex-end; }
.input {
  flex: 1; min-width: 0; width: 100%; font-size: 17px; line-height: 1.45; color: var(--ink);
  background: transparent; border: 0; border-bottom: 1.5px solid var(--line-strong); border-radius: 0; padding: 7px 2px 8px;
  outline: none; transition: border-color .15s;
}
.input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.input:focus { border-bottom-color: var(--accent); }
textarea.input { resize: vertical; min-height: 92px; field-sizing: content; max-height: 360px; }
.mic-sm {
  flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink-2); display: grid; place-items: center; transition: background .15s, color .15s, border-color .15s;
}
.mic-sm:hover { border-color: var(--accent); color: var(--accent); }
.field.is-listening .mic-sm { background: var(--rec); border-color: var(--rec); color: var(--rec-ink); }
.live { font-size: 14.5px; color: var(--muted); font-style: italic; min-height: 0; overflow-wrap: anywhere; }
.live:empty { display: none; }
@keyframes adv { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
button.chip:hover { border-color: var(--accent); color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .x { border: 0; background: transparent; padding: 0 0 0 2px; color: var(--muted); line-height: 1; font-size: 16px; }
.chip .lvl { font-size: 12px; color: var(--muted); }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.mini-note { font-size: 12.5px; color: var(--muted); }
.ai-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.ai-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-size: 13.5px; font-weight: 500;
}
.ai-btn:disabled { opacity: .6; cursor: progress; }
.suggest { border-left: 3px solid var(--accent); background: var(--surface-2); padding: 10px 12px; border-radius: 0 10px 10px 0; display: grid; gap: 8px; font-size: 15px; white-space: pre-wrap; }
.suggest .row { display: flex; gap: 8px; flex-wrap: wrap; white-space: normal; }

/* Repeating entries (jobs, schools) are separate objects, so they get a card */
.items { display: grid; gap: 16px; }
.item { border: 1px solid var(--line); border-radius: 18px; background: var(--surface-2); padding: 6px 6px 10px; }
.item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 4px 14px; }
.item-title { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-title span { color: var(--muted); font-weight: 400; }
.item .fields { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) {
  .item .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .item .field.wide { grid-column: 1 / -1; }
}
.text-btn { border: 0; background: transparent; color: var(--muted); font-size: 13.5px; padding: 6px 8px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center; }
.text-btn:hover { color: var(--rec); background: var(--rec-soft); }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.add-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px;
  border: 1.5px dashed var(--line); border-radius: 16px; background: transparent; color: var(--ink-2); font-weight: 500;
}
.add-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Gate (yes / no) */
.gate { display: flex; gap: 10px; flex-wrap: wrap; }
.gate .btn { min-width: 120px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15.5px;
  text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--rec); border-color: var(--rec); color: var(--rec-ink); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn:has(> input.sr:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
label.btn { cursor: pointer; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Intro ---------- */
.intro { display: grid; gap: 26px; max-width: 680px; }
.hero { font-family: var(--f-display); font-weight: 400; margin: 0; font-size: clamp(40px, 8vw + 8px, 68px); line-height: 1.0; letter-spacing: -.012em; text-wrap: balance; }
.hero em { color: var(--accent); }
.lead { margin: 0; font-size: 18px; color: var(--ink-2); max-width: 46ch; text-wrap: pretty; }
.how { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: how; }
.how li { counter-increment: how; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 12px; align-items: baseline; }
.how li::before {
  content: counter(how); grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-size: 20px; color: var(--accent); border: 1px solid var(--accent); align-self: start;
}
.how b { font-weight: 600; font-size: 16px; }
.how span { color: var(--muted); font-size: 14.5px; }
.check {
  display: grid; gap: 10px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
}
.check-head { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.status-dot.ok { background: var(--accent); }
.status-dot.warn { background: #C98A00; }
.check p { margin: 0; color: var(--muted); font-size: 14px; }
.heard { font-size: 16px; color: var(--ink); font-style: italic; min-height: 1.5em; }
.opts { display: grid; gap: 4px; }
.opt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.opt-row:last-child { border-bottom: 0; }
.opt-row label { font-size: 15px; }
.opt-row small { display: block; color: var(--muted); font-size: 13px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }
details.more { border-top: 1px solid var(--line); padding-top: 12px; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 20px; line-height: 1; }
details.more[open] summary::after { content: "–"; }
.fine { font-size: 13px; color: var(--muted); margin: 0; max-width: 60ch; }
.resume { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 16px; background: var(--accent-soft); color: var(--ink); }
.resume p { margin: 0; flex: 1; min-width: 200px; }
.ai-card { display: grid; gap: 10px; padding: 16px; border-radius: 16px; border: 1px dashed var(--accent); background: var(--surface); }
.ai-card h3 { margin: 0; font-size: 16px; }
.ai-card p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- Photo ---------- */
.photo-box { display: grid; gap: 14px; justify-items: start; }
.drop {
  width: 100%; display: grid; place-items: center; gap: 10px; padding: 28px 16px; border-radius: 18px;
  border: 1.5px dashed var(--line); background: var(--surface); text-align: center; color: var(--muted);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.crop { display: grid; gap: 12px; justify-items: center; width: 100%; max-width: 340px; }
.crop canvas { width: min(300px, 80vw); height: min(300px, 80vw); border-radius: 16px; touch-action: none; cursor: grab; background: var(--surface-2); box-shadow: var(--shadow); max-width: 100%; }
.crop input[type="range"] { width: 100%; accent-color: var(--accent); }
.photo-now { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.photo-now img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; box-shadow: var(--shadow); }

/* ---------- Dock (thumb zone) ---------- */
.dock { z-index: 25; }
.dock-in { display: grid; gap: 8px; max-width: 720px; margin: 0 auto; }
.caption {
  min-height: 0; font-size: 17px; line-height: 1.35; color: var(--ink); text-align: center; font-style: italic;
  overflow-wrap: anywhere; max-height: 4.1em; overflow: hidden;
}
.caption:empty { display: none; }
.dock-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.nav-btn {
  min-height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink);
  white-space: nowrap;
}
.nav-btn.back { justify-self: start; }
.nav-btn.next { justify-self: end; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav-btn.next:hover { background: var(--accent-hover); }
.nav-btn:disabled { opacity: .45; cursor: default; }
.mic-big {
  position: relative; width: 72px; height: 72px; border-radius: 50%; border: 0;
  background: var(--ink); color: var(--bg); display: grid; place-items: center; box-shadow: var(--shadow);
  transition: transform .12s ease, background .15s;
}
.mic-big .ico { width: 30px; height: 30px; stroke-width: 1.9; }
.mic-big:active { transform: scale(.96); }
.mic-big[data-state="listening"] { background: var(--rec); color: var(--rec-ink); }
.mic-big[data-state="speaking"] { background: var(--accent); color: var(--accent-ink); }
.mic-big[data-state="blocked"] { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.mic-big[data-state="listening"]::before, .mic-big[data-state="listening"]::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--rec); animation: ring 1.8s ease-out infinite; pointer-events: none;
}
.mic-big[data-state="listening"]::after { animation-delay: .9s; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.55); opacity: 0; } }
.mic-big .st { display: none; }
.dock-status { text-align: center; font-size: 13px; color: var(--muted); min-height: 1.3em; }
.dock-adv { height: 3px; border-radius: 3px; overflow: hidden; background: transparent; }
.dock-adv i { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: adv var(--dur, 2s) linear forwards; }

/* Phone: fixed to the bottom edge. Wide: sticky at the bottom of the stage column. */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
@media (min-width: 900px) {
  .dock { position: sticky; left: auto; right: auto; bottom: 0; margin-top: 28px; padding-left: 0; padding-right: 0; border-top: 0;
    background: linear-gradient(to bottom, transparent, var(--bg) 26%); padding-top: 26px; }
  .dock-in { margin: 0; }
}
body[data-kind="intro"] .dock { display: none; }
body[data-kind="intro"] .stage { padding-bottom: 40px; }
body[data-kind="preview"] .mic-big { visibility: hidden; }

/* ---------- Preview ---------- */
.pv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 2px 2px 10px; }
.badge { font-size: 11.5px; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); text-transform: none; font-weight: 600; }
.pages { display: grid; gap: 14px; }
.page { position: relative; background: var(--sheet); border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; aspect-ratio: 210 / 297; max-width: 100%; }
.page canvas { display: block; width: 100%; height: 100%; }
.page-no { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #6b7570; font-variant-numeric: tabular-nums; }
.pv-empty { display: grid; place-items: center; aspect-ratio: 210 / 297; border-radius: 4px; background: var(--surface); border: 1px dashed var(--line); color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
.pv-busy { opacity: .55; transition: opacity .2s; }

.final { display: grid; gap: 24px; max-width: 1100px; }
.final-grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1040px) { .final-grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } .final-controls { position: sticky; top: 84px; } }
.final-controls { display: grid; gap: 20px; }
.ctl h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tpls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 400px; }
.tpl { display: grid; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tpl[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); color: var(--ink); }
.tpl-thumb { aspect-ratio: 210 / 297; border-radius: 3px; background: var(--sheet); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); position: relative; overflow: hidden; }
.tpl-thumb i { position: absolute; display: block; background: #d7dcd9; border-radius: 1px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line-strong); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.big-pages { display: grid; gap: 18px; max-width: 720px; width: 100%; }

/* ---------- Sheets & toast ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: grid; }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet-panel {
  position: relative; align-self: end; justify-self: center; width: min(760px, 100%); max-height: 92vh; overflow: auto;
  background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding-top: 8px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 900px) { .sheet-panel { align-self: center; border-radius: 22px; max-height: 88vh; } }
.sheet-head { position: sticky; top: -8px; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; background: var(--bg); }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 80;
  bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px));
  max-width: min(520px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg);
  font-size: 14.5px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .mic-big[data-state="listening"]::before, .mic-big[data-state="listening"]::after { display: none; }
  .dock-adv i { animation-duration: var(--dur, 2.3s) !important; }
}
</style>
